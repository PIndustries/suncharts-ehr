[package]
name = "suncharts-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-only"
publish = false
description = "SunCharts Engine: an independent clinical record service"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
jsonwebtoken = { version = "10.4", default-features = false, features = ["aws_lc_rs"] }
thiserror = "2"
async-trait = "0.1"
argon2 = "0.5"
sha2 = "0.10"
rand = "0.8"
url = "2"
base64 = "0.22"
subtle = "2"
async-stream = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }

[build-dependencies]
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
