name: Publish immutable EHR image

on:
  push:
    tags: ['v*']
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      lane:
        description: Publication lane to run
        required: true
        default: amd64-release
        type: choice
        options:
          - amd64-release
          - arm64-mirror

concurrency:
  group: publish-ehr-image-${{ github.ref }}-${{ github.event_name }}-${{ inputs.lane || 'tag' }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE_NAME: ghcr.io/pindustries/suncharts-ehr
  RUST_IMAGE: rust:1.89-bookworm@sha256:948f9b08a66e7fe01b03a98ef1c7568292e07ec2e4fe90d88c07bb14563c84ff
  RUNTIME_IMAGE: debian:bookworm-slim@sha256:99c0b25c46d0214d5a2091092e7908907dcaecd6a962cde0ac700acee222b6f3
  CMAKE_VERSION: 3.31.8
  CMAKE_X86_64_SHA256: 630615d8e98ac33eba7fbe472626dff5c899c85af3c024585ae109166a6909d0
  CMAKE_AARCH64_SHA256: 609735983e3bdf24b6ab379d918458d64196fe72b98226f62dd5e9fe7b2997cc

jobs:
  full_regression:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.lane == 'amd64-release')
    uses: ./.github/workflows/full-regression.yml

  publish_amd64:
    needs: full_regression
    if: >-
      needs.full_regression.result == 'success' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.lane == 'amd64-release'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish commit-addressed image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            RUST_IMAGE=${{ env.RUST_IMAGE }}
            RUNTIME_IMAGE=${{ env.RUNTIME_IMAGE }}
            CMAKE_VERSION=${{ env.CMAKE_VERSION }}
            CMAKE_X86_64_SHA256=${{ env.CMAKE_X86_64_SHA256 }}
            CMAKE_AARCH64_SHA256=${{ env.CMAKE_AARCH64_SHA256 }}
          cache-from: type=gha,scope=suncharts-ehr-amd64
          cache-to: type=gha,mode=max,scope=suncharts-ehr-amd64
          provenance: mode=max
          sbom: true
      - name: Record immutable provisioning input
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          printf '%s@%s\n' "$IMAGE_NAME" "$IMAGE_DIGEST" > image-reference.txt
          sha256sum Dockerfile Cargo.lock BUILD_VERSION > build-inputs.sha256
          printf 'GIT_SHA=%s\nRUST_IMAGE=%s\nRUNTIME_IMAGE=%s\nCMAKE_VERSION=%s\nCMAKE_X86_64_SHA256=%s\nCMAKE_AARCH64_SHA256=%s\n' \
            "$GITHUB_SHA" "$RUST_IMAGE" "$RUNTIME_IMAGE" "$CMAKE_VERSION" \
            "$CMAKE_X86_64_SHA256" "$CMAKE_AARCH64_SHA256" > build-inputs.env
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: suncharts-ehr-image-${{ github.sha }}
          path: |
            image-reference.txt
            build-inputs.sha256
            build-inputs.env
          if-no-files-found: error
      - id: image-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Build release control manifest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          python3 scripts/build_release_manifest.py \
            --image-reference "$IMAGE_NAME@$IMAGE_DIGEST" \
            --source-commit "$GITHUB_SHA" \
            --source-tag "$GITHUB_REF_NAME" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --rust-image "$RUST_IMAGE" \
            --runtime-image "$RUNTIME_IMAGE" \
            --cmake-version "$CMAKE_VERSION" \
            --cmake-x86-64-sha256 "$CMAKE_X86_64_SHA256" \
            --cmake-aarch64-sha256 "$CMAKE_AARCH64_SHA256" \
            --output release-manifest.json
      - name: Attest release control manifest
        id: manifest-attestation
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-manifest.json
      - name: Prepare immutable GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE_ATTESTATION: ${{ steps.image-attestation.outputs.bundle-path }}
          MANIFEST_ATTESTATION: ${{ steps.manifest-attestation.outputs.bundle-path }}
        run: |
          cp "$IMAGE_ATTESTATION" image.attestation.json
          cp "$MANIFEST_ATTESTATION" release-manifest.attestation.json
          sha256sum release-manifest.json image-reference.txt build-inputs.sha256 build-inputs.env \
            image.attestation.json release-manifest.attestation.json > release-assets.sha256
      - name: Attach immutable inputs to existing GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          gh release upload "$GITHUB_REF_NAME" \
            release-manifest.json release-assets.sha256 image-reference.txt build-inputs.sha256 build-inputs.env \
            image.attestation.json release-manifest.attestation.json \
            --repo "$GITHUB_REPOSITORY"

  publish_arm64:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.lane == 'arm64-mirror')
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the ARM64 mirror
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-arm64
          build-args: |
            RUST_IMAGE=${{ env.RUST_IMAGE }}
            RUNTIME_IMAGE=${{ env.RUNTIME_IMAGE }}
            CMAKE_VERSION=${{ env.CMAKE_VERSION }}
            CMAKE_X86_64_SHA256=${{ env.CMAKE_X86_64_SHA256 }}
            CMAKE_AARCH64_SHA256=${{ env.CMAKE_AARCH64_SHA256 }}
          cache-from: type=gha,scope=suncharts-ehr-arm64
          cache-to: type=gha,mode=max,scope=suncharts-ehr-arm64
          provenance: mode=max
          sbom: true
      - name: Record immutable ARM64 mirror input
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          printf '%s@%s\n' "$IMAGE_NAME" "$IMAGE_DIGEST" > arm64-image-reference.txt
          sha256sum Dockerfile Cargo.lock BUILD_VERSION > arm64-build-inputs.sha256
          printf 'GIT_SHA=%s\nPLATFORM=linux/arm64\nRUST_IMAGE=%s\nRUNTIME_IMAGE=%s\nCMAKE_VERSION=%s\nCMAKE_X86_64_SHA256=%s\nCMAKE_AARCH64_SHA256=%s\n' \
            "$GITHUB_SHA" "$RUST_IMAGE" "$RUNTIME_IMAGE" "$CMAKE_VERSION" \
            "$CMAKE_X86_64_SHA256" "$CMAKE_AARCH64_SHA256" > arm64-build-inputs.env
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: suncharts-ehr-arm64-image-${{ github.sha }}
          path: |
            arm64-image-reference.txt
            arm64-build-inputs.sha256
            arm64-build-inputs.env
          if-no-files-found: error
      - name: Attest the ARM64 mirror digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  community-notification:
    needs: publish_amd64
    if: >-
      always() && github.event_name != 'schedule' &&
      (needs.publish_amd64.result == 'success' || needs.publish_amd64.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DISCORD_COMMUNITY_WEBHOOK_URL: ${{ secrets.DISCORD_COMMUNITY_WEBHOOK_URL }}
    steps:
      - name: Check out notification builder
        if: env.DISCORD_COMMUNITY_WEBHOOK_URL != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build public publication payload
        if: env.DISCORD_COMMUNITY_WEBHOOK_URL != ''
        env:
          PUBLICATION_RESULT: ${{ needs.publish_amd64.result }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            kind=release
            version="$GITHUB_REF_NAME"
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
          else
            kind=image
            version="sha-${GITHUB_SHA:0:12}"
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
          if [[ "$PUBLICATION_RESULT" == success ]]; then status=succeeded; else status=failed; fi
          python3 scripts/discord_community_payload.py \
            --kind "$kind" --status "$status" --version "$version" --url "$url" \
            --output community-payload.json
      - name: Notify Discord
        if: env.DISCORD_COMMUNITY_WEBHOOK_URL != ''
        continue-on-error: true
        run: >-
          curl --silent --show-error --fail --output /dev/null
          --header 'Content-Type: application/json'
          --data-binary @community-payload.json
          "$DISCORD_COMMUNITY_WEBHOOK_URL"
