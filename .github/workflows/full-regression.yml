name: Production release regression

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      promotion_target:
        description: Production channel being validated
        required: true
        type: choice
        options: [preview, stable]

permissions:
  contents: read

env:
  TEST_DATABASE_URL: postgres://engine_test:synthetic-ci-only@127.0.0.1:55473/engine_test

jobs:
  rust-quality:
    name: Rust format and lint
    runs-on: [self-hosted, Linux, X64, talos, ovh]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-release-quality-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Format and lint every Rust target
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings

  rust-regression:
    name: Rust and PostgreSQL regression outside connect_migrate
    runs-on: [self-hosted, Linux, X64, talos, ovh]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: engine_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: engine_test
        ports: ['55473:5432']
        options: >-
          --health-cmd "pg_isready -U engine_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-release-tests-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Run library, binary, documentation, and integration contracts
        run: |
          cargo test --locked --lib --bins
          cargo test --locked --doc
          cargo test --locked --test partner_support_sso
          for path in tests/*.rs; do
            test_name="$(basename "$path" .rs)"
            if [[ "$test_name" != connect_migrate && "$test_name" != partner_support_sso ]]; then
              cargo test --locked --test "$test_name"
            fi
          done

  connect-migrate-shards:
    name: Connect and migration partition ${{ matrix.shard }}
    runs-on: [self-hosted, Linux, X64, talos, ovh]
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: engine_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: engine_test
        ports: ['55473:5432']
        options: >-
          --health-cmd "pg_isready -U engine_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-release-tests-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Run one deterministic connect_migrate shard
        run: python3 scripts/connect_migrate_shards.py --shard ${{ matrix.shard }}

  script-contracts:
    name: Python, browser, and JavaScript contracts
    runs-on: [self-hosted, Linux, X64, talos, ovh]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Run all Python contracts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Run all browser fixture contracts
        run: |
          for test in scripts/test_*.cjs; do
            node "$test"
          done
      - name: Check every browser JavaScript file
        run: |
          for file in web/*.js; do
            node --check "$file"
          done

  release-gate:
    name: Require every release regression lane
    needs: [rust-quality, rust-regression, connect-migrate-shards, script-contracts]
    if: always()
    runs-on: [self-hosted, Linux, X64, talos, ovh]
    steps:
      - name: Preserve the complete production release gate
        env:
          QUALITY_RESULT: ${{ needs.rust-quality.result }}
          RUST_RESULT: ${{ needs.rust-regression.result }}
          SHARD_RESULT: ${{ needs.connect-migrate-shards.result }}
          SCRIPT_RESULT: ${{ needs.script-contracts.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$RUST_RESULT" = success
          test "$SHARD_RESULT" = success
          test "$SCRIPT_RESULT" = success
