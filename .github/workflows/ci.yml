name: Development verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  plan:
    name: Select changed-path checks
    runs-on: [self-hosted, Linux, X64]
    outputs:
      rust_changed: ${{ steps.plan.outputs.rust_changed }}
      migration_smoke: ${{ steps.plan.outputs.migration_smoke }}
      rust_tests: ${{ steps.plan.outputs.rust_tests }}
      python_tests: ${{ steps.plan.outputs.python_tests }}
      ui_tests: ${{ steps.plan.outputs.ui_tests }}
      javascript_files: ${{ steps.plan.outputs.javascript_files }}
      openapi_files: ${{ steps.plan.outputs.openapi_files }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify CI routing policy
        run: python3 -m unittest scripts.test_ci_change_plan scripts.test_runner_pool_policy
      - name: Build bounded check plan
        id: plan
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$EVENT_BASE"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          python3 scripts/ci_change_plan.py --base "$base" --head HEAD

  fast-rust:
    name: Fast Rust compile, migration, and focused tests
    needs: plan
    if: needs.plan.outputs.rust_changed == 'true'
    runs-on: [self-hosted, Linux, X64]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: engine_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: engine_test
        ports: ['55473:5432']
        options: >-
          --health-cmd "pg_isready -U engine_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://engine_test:synthetic-ci-only@127.0.0.1:55473/engine_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-dev-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Format and compile all targets
        run: |
          cargo fmt --check
          cargo check --locked --all-targets
      - name: Lint changed Rust crate targets
        run: cargo clippy --locked --all-targets --no-deps -- -D warnings
      - name: Apply every migration to a fresh schema
        if: needs.plan.outputs.migration_smoke == 'true'
        run: cargo test --locked --test migration_smoke
      - name: Run focused integration contracts
        if: needs.plan.outputs.rust_tests != ''
        env:
          RUST_TESTS: ${{ needs.plan.outputs.rust_tests }}
        run: |
          for test in $RUST_TESTS; do
            cargo test --locked --test "$test"
          done

  targeted-scripts:
    name: Targeted Python, UI, and API contracts
    needs: plan
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: needs.plan.outputs.ui_tests != '' || needs.plan.outputs.javascript_files != ''
        with:
          node-version: '22'
      - name: Run selected Python contracts
        env:
          PYTHON_TESTS: ${{ needs.plan.outputs.python_tests }}
        run: python3 -m unittest $PYTHON_TESTS
      - name: Run selected UI fixtures
        if: needs.plan.outputs.ui_tests != ''
        env:
          UI_TESTS: ${{ needs.plan.outputs.ui_tests }}
        run: |
          for test in $UI_TESTS; do
            node "$test"
          done
      - name: Check changed browser JavaScript syntax
        if: needs.plan.outputs.javascript_files != ''
        env:
          JAVASCRIPT_FILES: ${{ needs.plan.outputs.javascript_files }}
        run: |
          for file in $JAVASCRIPT_FILES; do
            node --check "$file"
          done
      - name: Validate changed API documents
        if: needs.plan.outputs.openapi_files != ''
        env:
          OPENAPI_FILES: ${{ needs.plan.outputs.openapi_files }}
        run: |
          for file in $OPENAPI_FILES; do
            python3 -m json.tool "$file" >/dev/null
          done

  verify:
    needs: [plan, fast-rust, targeted-scripts]
    if: always()
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Preserve the required development verification gate
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          RUST_RESULT: ${{ needs.fast-rust.result }}
          SCRIPT_RESULT: ${{ needs.targeted-scripts.result }}
        run: |
          test "$PLAN_RESULT" = success
          test "$SCRIPT_RESULT" = success
          case "$RUST_RESULT" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
